name: Cloudflare 优选 IP 订阅维护

on:
  schedule:
    - cron: '0 0 * * *'   # 每天凌晨0点 UTC 跑；想每6小时改 '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  maintain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 刷新测速结果（仅在 runner 能拿到有效速度时更新 result.csv）
        run: |
          # 注意：新版文件名已从 CloudflareST_linux_amd64.tar.gz 改为 cfst_linux_amd64.tar.gz
          wget -N https://github.com/XIU2/CloudflareSpeedTest/releases/latest/download/cfst_linux_amd64.tar.gz
          tar -zxf cfst_linux_amd64.tar.gz --strip-components=1 cfst_linux_amd64/cfst
          chmod +x cfst

          # 仅测延迟（GitHub Actions 出口对 CF 下载测速地址常返回 0.00，速度不可靠）
          # 所以用 -dd 只测延迟，结果按延迟排序；真正的“速度优选”在你本机跑 CFST 覆盖 result.csv
          ./cfst -o result.csv -dd -tl 200 -dn 20 || true

          # 转换为 WorkerVless2sub ADDCSV 所需格式
          # 要求（见 _worker.js 整理测速结果）：第0列=IP, 第1列=端口, 有 TLS 列(写 TRUE),
          #       TLS后偏移1列=数据中心, 末列=下载速度(MB/s)
          # 注意：Actions 测不出速度，这里速度列填 0（交给 worker 的 DLS 不会全过滤掉延迟优选 IP）
          awk -F',' 'NR==1 { next }
          {
            ip=$1; port="443"; tls="TRUE"; region=$7; speed="0";
            if (ip == "") next;
            printf "%s,%s,%s,%s,%s\n", ip, port, tls, region, speed;
          }' result.csv > result.addcsv.csv

          { echo "IP地址,端口,TLS,数据中心,下载速度(MB/s)"; cat result.addcsv.csv; } > result.csv
          echo "=== result.csv 行数（含表头）==="
          wc -l < result.csv

      - name: 提交 result.csv（raw 自动更新；本机可随时覆盖）
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add result.csv
          if git diff --cached --quiet; then
            echo "无变化，跳过提交"
          else
            git commit -m "Refresh CloudflareSpeedTest result.csv (latency-only on Actions)"
            git push
          fi
